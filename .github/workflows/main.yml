name: Build and Deploy Hugo Site

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  build:
    name: Build Hugo site and publish to Pages repo
    needs: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source and theme submodule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: main
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.140.2'
          extended: true

      - name: Build site
        run: |
          cd main
          hugo mod init github.com/nulvox/gohugo-theme-ananke
          hugo --minify

      - name: Checkout pages repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: brokengadgets/brokengadgets.github.io
          path: pages
          persist-credentials: false

      - name: Copy and deploy
        env:
          HUGO_PAT: ${{ secrets.HUGO_PAT }}
        run: |
          cd pages
          date > generated.txt
          rm -rf images/*
          cp -pr ../main/public/* .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "generated by hugo runner for commit $GITHUB_SHA"
          git push "https://x-access-token:${HUGO_PAT}@github.com/brokengadgets/brokengadgets.github.io.git" HEAD:main

name: Build and Deploy Hugo Site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Weekly Sunday 07:00 UTC keepalive so the deploy key and Pages pipeline stay active
    - cron: '0 7 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  build:
    name: Build Hugo site and publish to Pages repo
    needs: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source and theme submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.140.2'
          extended: true

      - name: Build site
        run: |
          cd main
          hugo --minify

      - name: Checkout pages repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brokengadgets/brokengadgets.github.io
          path: pages
          persist-credentials: false

      - name: Copy and deploy via SSH deploy key
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$PAGES_DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          cd pages
          date > generated.txt
          rm -rf images/*
          cp -pr ../main/public/* .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "generated by hugo runner for commit $GITHUB_SHA"
          git push git@github.com:brokengadgets/brokengadgets.github.io.git HEAD:main
